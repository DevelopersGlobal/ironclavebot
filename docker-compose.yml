services:
  ironclavebot:
    build: .
    container_name: ironclavebot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LLM_PROVIDER=openai # openai | ollama | mock
      - LLM_MODEL=gpt-4o
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECURITY_MODE=interactive
      - DATABASE_PATH=/ironclave/data/ironclavebot.db
      - SANDBOX_WORKDIR=/ironclave/workspace
    volumes:
      - ./data:/ironclave/data
      - ./workspace:/ironclave/workspace
